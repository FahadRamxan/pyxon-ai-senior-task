<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pyxon AI Chatbot</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f0f12;
      color: #e4e4e7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #27272a;
      font-weight: 600;
      font-size: 1.1rem;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 48rem;
      margin: 0 auto;
      width: 100%;
    }
    .msg {
      padding: 0.75rem 1rem;
      border-radius: 12px;
      max-width: 85%;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #3b82f6;
      color: #fff;
    }
    .msg.assistant {
      align-self: flex-start;
      background: #27272a;
      border: 1px solid #3f3f46;
    }
    .msg.error {
      align-self: flex-start;
      background: #7f1d1d;
      border: 1px solid #991b1b;
    }
    .input-area {
      padding: 1rem 1.5rem 1.5rem;
      border-top: 1px solid #27272a;
      max-width: 48rem;
      margin: 0 auto;
      width: 100%;
    }
    .input-wrap {
      display: flex;
      gap: 0.5rem;
      align-items: flex-end;
    }
    #input {
      flex: 1;
      min-height: 44px;
      max-height: 160px;
      padding: 0.6rem 1rem;
      border-radius: 10px;
      border: 1px solid #3f3f46;
      background: #18181b;
      color: #e4e4e7;
      font: inherit;
      resize: none;
    }
    #input::placeholder { color: #71717a; }
    #input:focus {
      outline: none;
      border-color: #3b82f6;
    }
    #send {
      padding: 0.6rem 1.2rem;
      border-radius: 10px;
      border: none;
      background: #3b82f6;
      color: #fff;
      font-weight: 500;
      cursor: pointer;
    }
    #send:hover { background: #2563eb; }
    #send:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg code {
      font-family: ui-monospace, monospace;
      font-size: 0.875em;
      padding: 0.15em 0.4em;
      border-radius: 6px;
      background: #3f3f46;
      color: #e4e4e7;
    }
    .msg strong { font-weight: 700; }
    .msg em { font-style: italic; }
    .msg .md-h1 { font-size: 1.15em; font-weight: 700; margin: 0.5em 0 0.25em; line-height: 1.3; }
    .msg .md-h2 { font-size: 1.08em; font-weight: 700; margin: 0.45em 0 0.2em; line-height: 1.3; }
    .msg .md-h3 { font-size: 1em; font-weight: 600; margin: 0.4em 0 0.2em; line-height: 1.35; }
    .msg .md-h4, .msg .md-h5, .msg .md-h6 { font-size: 0.95em; font-weight: 600; margin: 0.35em 0 0.15em; }
    .msg .md-h1:first-child { margin-top: 0; }
    .msg a { color: #3b82f6; text-decoration: none; }
    .msg a:hover { text-decoration: underline; }
    .typing {
      align-self: flex-start;
      padding: 0.5rem 1rem;
      color: #71717a;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="header">Pyxon AI Chatbot</div>
  <div class="messages" id="messages"></div>
  <div class="input-area">
    <div class="input-wrap">
      <textarea id="input" rows="1" placeholder="Type a message..." autofocus></textarea>
      <button type="button" id="send">Send</button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    function escapeHtml(s) {
      if (typeof s !== 'string') return '';
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function safeUrl(url) {
      if (typeof url !== 'string') return '';
      const t = url.trim();
      return (t.startsWith('http://') || t.startsWith('https://')) ? t : '';
    }
    function renderMarkdown(text) {
      let t = escapeHtml(text);
      const urlRe = '(https?:\\/\\/[^\\s\\)"\']+)';
      t = t.replace(new RegExp('!\\[([^\\]]*)\\]\\(' + urlRe + '\\)', 'g'), (_, alt, u) =>
        safeUrl(u) ? '<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + (alt || 'Image link') + '</a>' : _);
      t = t.replace(new RegExp('\\[([^\\]]+)\\]\\(' + urlRe + '\\)', 'g'), (_, txt, u) =>
        safeUrl(u) ? '<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + txt + '</a>' : _);
      t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      t = t.replace(/\*(.+?)\*/g, '<em>$1</em>');
      t = t.replace(/_(.+?)_/g, '<em>$1</em>');
      t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
      const lines = t.split('\n');
      const out = lines.map(line => {
        const m = line.match(/^(#{1,6})\s+(.+)$/);
        if (m) {
          const level = Math.min(m[1].length, 6);
          return '<span class="md-h' + level + '">' + m[2] + '</span>';
        }
        return line;
      });
      return out.join('<br>');
    }
    function addMessage(role, text, isError = false) {
      const div = document.createElement('div');
      div.className = 'msg ' + (isError ? 'error' : role);
      div.innerHTML = renderMarkdown(text);
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function showTyping(show) {
      let el = document.getElementById('typing-dot');
      if (show && !el) {
        el = document.createElement('div');
        el.className = 'typing';
        el.id = 'typing-dot';
        el.textContent = 'Thinking…';
        messagesEl.appendChild(el);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      } else if (!show && el) {
        el.remove();
      }
    }

    async function send() {
      const text = inputEl.value.trim();
      if (!text) return;
      inputEl.value = '';
      addMessage('user', text);
      sendBtn.disabled = true;
      showTyping(true);
      try {
        const res = await fetch('/chat/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.output != null) {
          addMessage('assistant', data.output);
        } else {
          addMessage('assistant', data.detail || data.message || 'Something went wrong.', true);
        }
      } catch (e) {
        addMessage('assistant', 'Network error: ' + e.message, true);
      }
      showTyping(false);
      sendBtn.disabled = false;
      inputEl.focus();
    }

    sendBtn.addEventListener('click', send);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
  </script>
</body>
</html>
