<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pyxon-Test</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: transparent; }

    .pyxon-widget {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 2147483647;
      font-size: 15px;
    }

    /* Theme: light (default) */
    .pyxon-widget__panel {
      --px-bg: #fafafa;
      --px-bg-header: #f4f4f5;
      --px-border: #e4e4e7;
      --px-text: #18181b;
      --px-text-muted: #71717a;
      --px-msg-user-bg: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      --px-msg-bot-bg: #e4e4e7;
      --px-input-bg: #fff;
      --px-shadow: 0 20px 60px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.06);
    }
    .pyxon-widget__panel.is-dark {
      --px-bg: #18181b;
      --px-bg-header: #27272a;
      --px-border: #3f3f46;
      --px-text: #e4e4e7;
      --px-text-muted: #71717a;
      --px-msg-user-bg: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      --px-msg-bot-bg: #27272a;
      --px-input-bg: #27272a;
      --px-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.06);
    }

    .pyxon-widget__fab {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.45);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .pyxon-widget__fab:hover { transform: scale(1.06); box-shadow: 0 6px 24px rgba(59, 130, 246, 0.5); }
    .pyxon-widget__fab:active { transform: scale(0.98); }
    .pyxon-widget__fab svg { width: 28px; height: 28px; }
    @keyframes fabIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }
    .pyxon-widget__fab { animation: fabIn 0.4s cubic-bezier(0.22, 1, 0.36, 1); }

    .pyxon-widget__panel {
      position: absolute;
      bottom: 72px;
      right: 0;
      width: 380px;
      max-width: calc(100vw - 48px);
      height: 520px;
      max-height: calc(100vh - 120px);
      background: var(--px-bg);
      border-radius: 20px;
      box-shadow: var(--px-shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
      transform: translateY(20px) scale(0.95);
      transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s, background 0.25s, box-shadow 0.25s;
    }
    .pyxon-widget__panel.is-open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }
    .pyxon-widget__panel.is-open .pyxon-widget__welcome,
    .pyxon-widget__panel.is-open .pyxon-widget__disclaimer,
    .pyxon-widget__panel.is-open .pyxon-widget__form { animation: stepIn 0.4s ease forwards; }
    @keyframes stepIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .pyxon-widget__header {
      padding: 14px 18px;
      background: var(--px-bg-header);
      border-bottom: 1px solid var(--px-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      transition: background 0.25s, border-color 0.25s;
    }
    .pyxon-widget__title { font-weight: 600; color: var(--px-text); font-size: 0.9375rem; transition: color 0.25s; }
    .pyxon-widget__header-actions { display: flex; align-items: center; gap: 8px; }
    .pyxon-widget__lang-toggle {
      display: flex;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--px-border);
      background: var(--px-bg);
    }
    .pyxon-widget__lang-btn {
      padding: 6px 12px;
      border: none;
      background: transparent;
      color: var(--px-text-muted);
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.2s, background 0.2s;
    }
    .pyxon-widget__lang-btn:hover { color: var(--px-text); }
    .pyxon-widget__lang-btn.active { background: #3b82f6; color: #fff; }
    .pyxon-widget__mode-toggle {
      display: flex; border-radius: 10px; overflow: hidden; border: 1px solid var(--px-border);
      background: var(--px-bg); margin: 0 18px 10px; align-self: flex-start;
    }
    .pyxon-widget__mode-btn {
      padding: 6px 12px; border: none; background: transparent; color: var(--px-text-muted);
      font-size: 0.75rem; font-weight: 500; cursor: pointer; transition: background 0.2s, color 0.2s;
    }
    .pyxon-widget__mode-btn:hover { color: var(--px-text); }
    .pyxon-widget__mode-btn.active { background: #3b82f6; color: #fff; }
    .pyxon-widget__theme-btn {
      width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--px-border);
      background: var(--px-bg); color: var(--px-text-muted); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, color 0.2s, transform 0.2s;
    }
    .pyxon-widget__theme-btn:hover { color: var(--px-text); transform: rotate(15deg); }
    .pyxon-widget__theme-btn svg { width: 18px; height: 18px; }

    /* Pre-chat: modern & elegant */
    .pyxon-widget__welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 36px 28px;
      text-align: center;
    }
    .pyxon-widget__welcome.hidden { display: none; }
    .pyxon-widget__welcome-card {
      animation: cardFade 0.5s ease;
      width: 100%;
      max-width: 320px;
      padding: 28px 24px;
      border-radius: 16px;
      border: 1px solid var(--px-border);
      background: var(--px-bg);
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      transition: box-shadow 0.25s, border-color 0.25s;
    }
    @keyframes cardFade {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .pyxon-widget__welcome-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--px-text);
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }
    .pyxon-widget__welcome-text {
      font-size: 0.9375rem;
      color: var(--px-text-muted);
      margin-bottom: 26px;
      line-height: 1.55;
    }
    .pyxon-widget__start-btn {
      padding: 14px 32px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: #fff;
      font-weight: 600;
      font-size: 0.9375rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .pyxon-widget__start-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(59, 130, 246, 0.35); }
    .pyxon-widget__welcome-mode {
      margin: 16px 0 20px 0;
      text-align: left;
    }
    .pyxon-widget__panel[dir="rtl"] .pyxon-widget__welcome-mode { text-align: right; }
    .pyxon-widget__welcome-mode-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--px-text-muted);
      margin-bottom: 8px;
    }
    .pyxon-widget__welcome-mode-options {
      display: flex;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--px-border);
      background: var(--px-bg);
    }
    .pyxon-widget__welcome-mode-btn {
      flex: 1;
      padding: 8px 14px;
      border: none;
      background: transparent;
      color: var(--px-text-muted);
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .pyxon-widget__welcome-mode-btn:hover { color: var(--px-text); }
    .pyxon-widget__welcome-mode-btn.active { background: #3b82f6; color: #fff; }

    .pyxon-widget__disclaimer {
      padding: 20px 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      flex: 0 1 auto;
    }
    .pyxon-widget__disclaimer.hidden { display: none; }
    .pyxon-widget__disclaimer-card {
      padding: 16px 18px;
      border-radius: 12px;
      border: 1px solid var(--px-border);
      background: var(--px-bg);
      margin-bottom: 0;
    }
    .pyxon-widget__disclaimer-title {
      font-size: 0.625rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--px-text-muted);
      margin-bottom: 10px;
    }
    .pyxon-widget__disclaimer-text {
      font-size: 0.75rem;
      color: var(--px-text);
      line-height: 1.55;
    }
    .pyxon-widget__disclaimer-text strong { font-weight: 600; color: var(--px-text); }
    .pyxon-widget__disclaimer-text ul {
      margin: 10px 0 0 0;
      padding-left: 1.1em;
      list-style: disc;
    }
    .pyxon-widget__panel[dir="rtl"] .pyxon-widget__disclaimer-text ul { padding-left: 0; padding-right: 1.1em; }
    .pyxon-widget__disclaimer-text li { margin-bottom: 8px; }
    .pyxon-widget__disclaimer-text li:last-child { margin-bottom: 0; }
    .pyxon-widget__disclaimer-text p { margin: 0 0 8px 0; }
    .pyxon-widget__disclaimer-text p:last-child { margin-bottom: 0; }
    .pyxon-widget__disclaimer-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    .pyxon-widget__accept-btn,
    .pyxon-widget__decline-btn {
      flex: 1;
      padding: 11px 16px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      font-size: 0.75rem;
      cursor: pointer;
      transition: opacity 0.2s, box-shadow 0.2s;
    }
    .pyxon-widget__accept-btn {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: #fff;
    }
    .pyxon-widget__accept-btn:hover { opacity: 0.92; box-shadow: 0 4px 14px rgba(59, 130, 246, 0.28); }
    .pyxon-widget__decline-btn {
      background: transparent;
      color: var(--px-text-muted);
      border: 1px solid var(--px-border);
    }
    .pyxon-widget__decline-btn:hover { color: var(--px-text); border-color: var(--px-text-muted); }

    .pyxon-widget__form {
      flex: 1;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .pyxon-widget__form.hidden { display: none; }
    .pyxon-widget__form-card {
      width: 100%;
      max-width: 320px;
      margin: 0 auto;
      padding: 26px 22px;
      border-radius: 16px;
      border: 1px solid var(--px-border);
      background: var(--px-bg);
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }
    .pyxon-widget__form-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--px-text);
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }
    .pyxon-widget__form-note {
      font-size: 0.8125rem;
      color: var(--px-text-muted);
      line-height: 1.5;
      margin-bottom: 18px;
    }
    .pyxon-widget__field { margin-bottom: 18px; }
    .pyxon-widget__field:last-of-type { margin-bottom: 22px; }
    .pyxon-widget__field label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--px-text-muted);
      margin-bottom: 6px;
    }
    .pyxon-widget__field input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--px-border);
      background: var(--px-input-bg);
      color: var(--px-text);
      font: inherit;
      font-size: 0.9375rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .pyxon-widget__field input::placeholder { color: var(--px-text-muted); }
    .pyxon-widget__field input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }
    .pyxon-widget__begin-btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: #fff;
      font-weight: 600;
      font-size: 0.9375rem;
      cursor: pointer;
      transition: opacity 0.2s, box-shadow 0.2s;
    }
    .pyxon-widget__begin-btn:hover { box-shadow: 0 6px 18px rgba(59, 130, 246, 0.3); }

    .pyxon-widget__panel[dir="rtl"] .pyxon-widget__welcome-card,
    .pyxon-widget__panel[dir="rtl"] .pyxon-widget__disclaimer-card,
    .pyxon-widget__panel[dir="rtl"] .pyxon-widget__form-card { text-align: right; }
    .pyxon-widget__panel[dir="rtl"] .pyxon-widget__disclaimer-text { text-align: right; }
    .pyxon-widget__panel[dir="rtl"] .pyxon-widget__disclaimer-actions { flex-direction: row-reverse; }

    /* Chat view (after onboarding) */
    .pyxon-widget__chat-view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .pyxon-widget__chat-view.hidden { display: none; }

    .pyxon-widget__messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }
    .pyxon-widget__empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .pyxon-widget__empty-state.hidden { display: none; }
    .pyxon-widget__empty-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #22c55e;
      margin-bottom: 12px;
      animation: dotPulse 1.5s ease-in-out infinite;
    }
    @keyframes dotPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(0.9); } }
    .pyxon-widget__empty-online {
      font-size: 0.8125rem;
      color: #22c55e;
      font-weight: 500;
      margin-bottom: 4px;
    }
    .pyxon-widget__empty-msg {
      font-size: 0.9375rem;
      color: var(--px-text-muted);
      line-height: 1.5;
    }

    .pyxon-widget__msg {
      padding: 10px 14px;
      border-radius: 16px;
      max-width: 88%;
      line-height: 1.35;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.8125rem;
      animation: msgIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .pyxon-widget__msg--assistant { padding-bottom: 28px; position: relative; }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .pyxon-widget__msg--user {
      align-self: flex-end;
      background: var(--px-msg-user-bg);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .pyxon-widget__msg--assistant {
      align-self: flex-start;
      background: var(--px-msg-bot-bg);
      color: var(--px-text);
      border: 1px solid var(--px-border);
      border-bottom-left-radius: 4px;
      transition: background 0.25s, color 0.25s, border-color 0.25s;
    }
    .pyxon-widget__msg-feedback {
      position: absolute;
      bottom: 6px;
      right: 10px;
      display: flex;
      gap: 2px;
      opacity: 0.5;
      transition: opacity 0.2s;
    }
    .pyxon-widget__msg--assistant:hover .pyxon-widget__msg-feedback { opacity: 0.85; }
    .pyxon-widget__msg-feedback button {
      width: 22px;
      height: 22px;
      border: none;
      background: transparent;
      color: var(--px-text-muted);
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
    }
    .pyxon-widget__msg-feedback button:hover { color: var(--px-text); background: var(--px-border); }
    .pyxon-widget__msg-feedback button.liked { color: #22c55e; }
    .pyxon-widget__msg-feedback button.disliked { color: #ef4444; }
    .pyxon-widget__msg-feedback button svg { width: 14px; height: 14px; }
    .pyxon-widget__panel[dir="rtl"] .pyxon-widget__msg-feedback { right: auto; left: 10px; }
    .pyxon-widget__msg--error {
      align-self: flex-start;
      background: #7f1d1d;
      color: #fecaca;
      border: 1px solid #991b1b;
      border-bottom-left-radius: 4px;
    }
    .pyxon-widget__msg code {
      font-family: ui-monospace, monospace;
      font-size: 0.875em;
      padding: 0.15em 0.4em;
      border-radius: 6px;
      background: var(--px-border);
      color: var(--px-text);
    }
    .pyxon-widget__msg strong { font-weight: 700; }
    .pyxon-widget__msg em { font-style: italic; }
    .pyxon-widget__msg .md-h1 { font-size: 1.08em; font-weight: 700; margin: 0.4em 0 0.15em; line-height: 1.3; }
    .pyxon-widget__msg .md-h2 { font-size: 1.04em; font-weight: 700; margin: 0.35em 0 0.12em; line-height: 1.3; }
    .pyxon-widget__msg .md-h3 { font-size: 0.98em; font-weight: 600; margin: 0.3em 0 0.1em; line-height: 1.35; }
    .pyxon-widget__msg .md-h4, .pyxon-widget__msg .md-h5, .pyxon-widget__msg .md-h6 { font-size: 0.92em; font-weight: 600; margin: 0.25em 0 0.08em; }
    .pyxon-widget__msg .md-h1:first-child { margin-top: 0; }
    .pyxon-widget__msg-list { margin: 0.35em 0; padding-left: 1.2em; list-style: disc; }
    .pyxon-widget__panel[dir="rtl"] .pyxon-widget__msg-list { padding-left: 0; padding-right: 1.2em; }
    .pyxon-widget__msg-list li { margin-bottom: 0.25em; }
    .pyxon-widget__msg a { color: #3b82f6; text-decoration: none; }
    .pyxon-widget__msg a:hover { text-decoration: underline; }
    /* Typing indicator: bubble with bouncing dots */
    .pyxon-widget__typing {
      align-self: flex-start;
      padding: 14px 18px;
      background: var(--px-msg-bot-bg);
      border: 1px solid var(--px-border);
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background 0.25s, border-color 0.25s;
    }
    .pyxon-widget__typing-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--px-text-muted);
      animation: typingBounce 1.4s ease-in-out infinite both;
    }
    .pyxon-widget__typing-dot:nth-child(1) { animation-delay: 0s; }
    .pyxon-widget__typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .pyxon-widget__typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    .pyxon-widget__input-wrap {
      padding: 12px 16px 16px;
      background: var(--px-bg);
      border-top: 1px solid var(--px-border);
      flex-shrink: 0;
      transition: background 0.25s, border-color 0.25s;
    }
    .pyxon-widget__row { display: flex; gap: 10px; align-items: flex-end; }
    .pyxon-widget__input {
      flex: 1;
      min-height: 44px;
      max-height: 120px;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid var(--px-border);
      background: var(--px-input-bg);
      color: var(--px-text);
      font: inherit;
      font-size: 0.9375rem;
      resize: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.25s, color 0.25s;
    }
    .pyxon-widget__input::placeholder { color: var(--px-text-muted); }
    .pyxon-widget__input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }
    .pyxon-widget__send,
    .pyxon-widget__end-chat {
      width: 44px; height: 44px; border-radius: 14px; border: none;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }
    .pyxon-widget__send {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: #fff;
    }
    .pyxon-widget__send:hover { transform: scale(1.05); }
    .pyxon-widget__send:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .pyxon-widget__send svg { width: 22px; height: 22px; }
    .pyxon-widget__end-chat {
      background: var(--px-bg-header);
      color: var(--px-text-muted);
      border: 1px solid var(--px-border);
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .pyxon-widget__end-chat:hover {
      background: #ef4444;
      color: #fff;
      border-color: #ef4444;
      transform: rotate(90deg);
    }
    .pyxon-widget__end-chat svg { width: 20px; height: 20px; }
    .pyxon-widget__attach-btn {
      width: 44px; height: 44px; border-radius: 14px; border: none;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; cursor: pointer;
      background: var(--px-bg-header);
      color: var(--px-text-muted);
      border: 1px solid var(--px-border);
      transition: color 0.2s, background 0.2s, border-color 0.2s;
    }
    .pyxon-widget__attach-btn:hover { color: var(--px-text); border-color: var(--px-text-muted); }
    .pyxon-widget__attach-btn svg { width: 20px; height: 20px; }
    .pyxon-widget__file-row {

<body>

  <script>

      var i18n = {
        en: {

          accept: 'أوافق',

          nameLabel: 'الاسم',

          greetingWithName: 'مرحباً {name}! كيف يمكنني مساعدتك اليوم؟',
          greetingNoName: 'كيف يمكنني مساعدتك اليوم؟',

          inputPlaceholder: 'اكتب رسالتك...',

          removeFile: 'إزالة'

      };

      function applyLang() {
        var t = i18n[lang] || i18n.en;
        panel.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
        document.getElementById('i18nWelcomeTitle').textContent = t.welcomeTitle;

        var wml = document.getElementById('i18nWelcomeModeLabel');
        if (wml) wml.textContent = t.welcomeModeLabel;
        var mg = document.getElementById('i18nModeGeneral');
        if (mg) mg.textContent = t.modeGeneral;
        var mr = document.getElementById('i18nModeRag');
        if (mr) mr.textContent = t.modeRag;
        var ms = document.getElementById('i18nModeSwarm');
        if (ms) ms.textContent = t.modeSwarm;
        document.getElementById('startChatBtn').textContent = t.startChat;
        document.getElementById('i18nDisclaimerTitle').textContent = t.disclaimerTitle;
        document.getElementById('i18nDisclaimerText').innerHTML = t.disclaimerHtml;
        document.getElementById('acceptBtn').textContent = t.accept;
        document.getElementById('declineBtn').textContent = t.decline;
        document.getElementById('i18nFormTitle').textContent = t.formTitle;
        document.getElementById('i18nFormNote').textContent = t.formNote;
        document.getElementById('i18nNameLabel').textContent = t.nameLabel;
        document.getElementById('i18nEmailLabel').textContent = t.emailLabel;
        document.getElementById('userName').placeholder = t.namePlaceholder;
        document.getElementById('userEmail').placeholder = t.emailPlaceholder;
        document.getElementById('beginBtn').textContent = t.beginBtn;
        document.getElementById('i18nOnline').textContent = t.online;
        document.getElementById('i18nEmptyMsg').textContent = t.emptyMsg;
        var greetingEl = document.querySelector('.pyxon-widget__msg[data-greeting="true"]');
        if (greetingEl) {
          var g = i18n[lang] || i18n.en;
          var greetingMsg = userName ? g.greetingWithName.replace('{name}', userName) : g.greetingNoName;
          greetingEl.innerHTML = renderMarkdown(greetingMsg);
        }
        if (inputEl) inputEl.placeholder = t.inputPlaceholder;
        if (fileBtn) { fileBtn.title = t.attachFile || 'Attach file'; fileBtn.setAttribute('aria-label', t.attachFile || 'Attach file'); }
        if (fileClear) fileClear.textContent = t.removeFile || 'Remove';
        document.getElementById('langEn').classList.toggle('active', lang === 'en');
        document.getElementById('langAr').classList.toggle('active', lang === 'ar');
      }

      document.getElementById('langEn').addEventListener('click', function() { lang = 'en'; applyLang(); });
      document.getElementById('langAr').addEventListener('click', function() { lang = 'ar'; applyLang(); });
      document.getElementById('welcomeModeGeneral').addEventListener('click', function() {
        chatMode = 'general';
        document.querySelectorAll('.pyxon-widget__welcome-mode-btn').forEach(function(b) { b.classList.remove('active'); });
        this.classList.add('active');
      });
      document.getElementById('welcomeModeRag').addEventListener('click', function() {
        chatMode = 'rag';
        document.querySelectorAll('.pyxon-widget__welcome-mode-btn').forEach(function(b) { b.classList.remove('active'); });
        this.classList.add('active');
      });
      document.getElementById('welcomeModeSwarm').addEventListener('click', function() {
        chatMode = 'swarm';
        document.querySelectorAll('.pyxon-widget__welcome-mode-btn').forEach(function(b) { b.classList.remove('active'); });
        this.classList.add('active');
      });
      document.getElementById('modeGeneral').addEventListener('click', function() {
        chatMode = 'general';
        document.querySelectorAll('.pyxon-widget__mode-btn').forEach(function(b) { b.classList.remove('active'); });
        this.classList.add('active');
      });
      document.getElementById('modeRag').addEventListener('click', function() {
        chatMode = 'rag';
        document.querySelectorAll('.pyxon-widget__mode-btn').forEach(function(b) { b.classList.remove('active'); });
        this.classList.add('active');
      });
      document.getElementById('modeSwarm').addEventListener('click', function() {
        chatMode = 'swarm';
        document.querySelectorAll('.pyxon-widget__mode-btn').forEach(function(b) { b.classList.remove('active'); });
        this.classList.add('active');
      });
      applyLang();

      function showStep(s) {
        step = s;
        stepWelcome.classList.toggle('hidden', s !== 0);
        stepDisclaimer.classList.toggle('hidden', s !== 1);
        stepForm.classList.toggle('hidden', s !== 2);
        chatView.classList.toggle('hidden', s !== 3);
        if (s === 3) {
          document.querySelectorAll('.pyxon-widget__mode-btn').forEach(function(b) {
            b.classList.toggle('active', b.getAttribute('data-mode') === chatMode);
          });
          inputEl.focus();
        }
      }

      document.getElementById('startChatBtn').addEventListener('click', function() { showStep(1); });
      document.getElementById('acceptBtn').addEventListener('click', function() { showStep(2); });
      document.getElementById('declineBtn').addEventListener('click', function() { showStep(0); });
      document.getElementById('beginBtn').addEventListener('click', function() {
        var nameEl = document.getElementById('userName');

        userEmail = (emailEl && emailEl.value) ? emailEl.value.trim() : '';

      var audioQueue = [];
      var audioPlaying = false;
      function playNotificationSound() {
        try {
          var AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          var ctx = new AudioContext();
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.setValueAtTime(523.25, ctx.currentTime);
          osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.08);
          osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.16);
          osc.type = 'sine';
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.25);
        } catch (e) {}
      }
      function queueNotificationSound() {
        audioQueue.push(1);
        if (audioPlaying) return;
        audioPlaying = true;
        function next() {
          if (audioQueue.length === 0) { audioPlaying = false; return; }
          audioQueue.shift();
          playNotificationSound();
          setTimeout(next, 320);
        }
        next();
      }

      function escapeHtml(s) {
        if (typeof s !== 'string') return '';
        return s
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }
      function safeUrl(url) {
        if (typeof url !== 'string') return '';
        var t = url.trim();
        return (t.indexOf('http://') === 0 || t.indexOf('https://') === 0) ? t : '';
      }
      function renderMarkdown(text) {
        var s = escapeHtml(text);
        s = s.replace(/\n{3,}/g, '\n\n');
        var urlRe = '(https?:\\/\\/[^\\s\\)"\']+)';
        s = s.replace(new RegExp('!\\[([^\\]]*)\\]\\(' + urlRe + '\\)', 'g'), function(_, alt, u) {
          return safeUrl(u) ? '<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + (alt || 'Image link') + '</a>' : _;
        });
        s = s.replace(new RegExp('\\[([^\\]]+)\\]\\(' + urlRe + '\\)', 'g'), function(_, txt, u) {
          return safeUrl(u) ? '<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + txt + '</a>' : _;
        });
        s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
        s = s.replace(/_(.+?)_/g, '<em>$1</em>');
        s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
        var lines = s.split('\n');
        var out = [];
        var inList = false;
        for (var i = 0; i < lines.length; i++) {
          var line = lines[i];
          var bullet = line.match(/^[\*\-\•]\s+(.+)$/);
          var m = line.match(/^(#{1,6})\s+(.+)$/);
          if (m) {
            if (inList) { out.push('</ul>'); inList = false; }
            var level = Math.min(m[1].length, 6);
            out.push('<span class="md-h' + level + '">' + m[2] + '</span>');
          } else if (bullet) {
            if (!inList) { out.push('<ul class="pyxon-widget__msg-list">'); inList = true; }
            out.push('<li>' + bullet[1] + '</li>');
          } else {
            if (inList) { out.push('</ul>'); inList = false; }
            out.push(line);
          }
        }
        if (inList) out.push('</ul>');
        s = out.join('<br>');
        return s;
      }

      function addMessage(role, text, isError, isGreeting) {
        if (emptyState) emptyState.classList.add('hidden');
        var div = document.createElement('div');
        div.className = 'pyxon-widget__msg pyxon-widget__msg--' + (isError ? 'error' : role);
        if (isGreeting) div.setAttribute('data-greeting', 'true');
        div.innerHTML = renderMarkdown(text);
        if (role === 'assistant' && !isError) {
          var feedback = document.createElement('div');
          feedback.className = 'pyxon-widget__msg-feedback';
          feedback.innerHTML = '<button type="button" class="px-like" aria-label="Like" title="Like"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg></button><button type="button" class="px-dislike" aria-label="Dislike" title="Dislike"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"/></svg></button>';
          var likeBtn = feedback.querySelector('.px-like');
          var dislikeBtn = feedback.querySelector('.px-dislike');
          likeBtn.addEventListener('click', function() {
            likeBtn.classList.add('liked');
            dislikeBtn.classList.remove('disliked');
          });
          dislikeBtn.addEventListener('click', function() {
            dislikeBtn.classList.add('disliked');
            likeBtn.classList.remove('liked');
          });
          div.appendChild(feedback);
        }
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        if (role === 'assistant' && !isError) queueNotificationSound();
      }
      function showTyping(show) {
        var el = document.getElementById('pyxon-typing');
        if (show && !el) {
          el = document.createElement('div');
          el.className = 'pyxon-widget__typing';
          el.id = 'pyxon-typing';
          el.setAttribute('aria-live', 'polite');
          el.innerHTML = '<span class="pyxon-widget__typing-dot"></span><span class="pyxon-widget__typing-dot"></span><span class="pyxon-widget__typing-dot"></span>';
          messagesEl.appendChild(el);
          messagesEl.scrollTop = messagesEl.scrollHeight;
        } else if (!show && el) el.remove();
      }

      var fileRow = document.getElementById('fileRow');
      function clearFile() {
        if (fileInput) fileInput.value = '';
        if (fileName) fileName.textContent = '';
        if (fileRow) fileRow.classList.add('is-empty');
      }
      if (fileBtn && fileInput) fileBtn.addEventListener('click', function() { fileInput.click(); });
      if (fileInput && fileName && fileRow) {
        fileInput.addEventListener('change', function() {
          if (fileInput.files && fileInput.files.length > 0) {
            fileName.textContent = fileInput.files[0].name;
            if (fileRow) fileRow.classList.remove('is-empty');
          } else clearFile();
        });
      }
      if (fileClear) fileClear.addEventListener('click', clearFile);

      function send() {
        var text = inputEl.value.trim();
        if (!text) return;
        var includeTrace = (chatMode === 'swarm');
        var hasFile = fileInput && fileInput.files && fileInput.files.length > 0;
        inputEl.value = '';
        addMessage('user', text + (hasFile ? ' [file: ' + fileInput.files[0].name + ']' : ''));
        sendBtn.disabled = true;
        showTyping(true);
        var opts = { method: 'POST' };
        if (hasFile) {
          var fd = new FormData();
          fd.append('message', text);
          fd.append('mode', chatMode || 'general');
          fd.append('include_trace', includeTrace ? 'true' : 'false');
          fd.append('file', fileInput.files[0]);
          opts.body = fd;
        } else {
          opts.headers = { 'Content-Type': 'application/json' };
          opts.body = JSON.stringify({ message: text, mode: chatMode || 'general', include_trace: includeTrace });
        }
        fetch(apiBase + '/chat/', opts)
          .then(function(r) { return r.json().catch(function() { return {}; }); })
          .then(function(data) {
            showTyping(false);
            if (data.output != null) addMessage('assistant', data.output);
            else addMessage('assistant', data.detail || data.message || 'Something went wrong.', true);
          })
          .catch(function(e) {
            showTyping(false);
            addMessage('assistant', 'Network error: ' + e.message, true);
          })
          .finally(function() {
            sendBtn.disabled = false;
            clearFile();
            inputEl.focus();
          });
      }

      fab.addEventListener('click', function() {
        if (isOpen()) closePanel(); else openPanel();
      });
      endChatBtn.addEventListener('click', closePanel);
      sendBtn.addEventListener('click', send);
      inputEl.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
      });
    })();
  </script>
</body>
</html>
